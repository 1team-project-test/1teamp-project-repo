<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬치꼬치 AI 면접 코칭 - 로그인</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #f7f3ee; /* 이미지 로딩 전 자연스러운 미색 배경 */
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 💡 1. 배경을 interview.png 풀스크린으로 지정하고 정중앙 정렬 */
        .background-container {
            width: 100vw;
            height: 100vh;
            background-image: url("../interview.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            box-sizing: border-box;
        }

        /* 💡 2. 폼 컨테이너를 카페 조명에 어울리는 반투명 크림 화이트로 수정 */
        .form-container {
            width: 400px; 
            background: rgba(255, 255, 255, 0.94);
            padding: 40px;
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(139, 90, 43, 0.2);
            border: 1px solid rgba(230, 215, 200, 0.8);
            box-sizing: border-box;
            text-align: center;
        }

        .form-container h2 { 
            margin-top: 0; 
            color: #e05300; 
            margin-bottom: 30px; 
            font-size: 1.8rem;
            font-weight: 800;
        }

        .input-group { 
            margin-bottom: 20px; 
            text-align: left;
        }
        
        .input-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.9rem; 
            color: #5d4037; 
            font-weight: bold; 
        }
        
        input {
            width: 100%; 
            padding: 14px; 
            background: #ffffff; 
            border: 1px solid #d7ccc8;
            border-radius: 10px; 
            color: #3e2723;
            font-size: 0.95rem; 
            box-sizing: border-box; 
            outline: none;
            transition: all 0.2s ease;
        }
        
        input:focus { 
            border-color: #007bc4; 
            box-shadow: 0 0 5px rgba(0, 123, 196, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #007bc4, #005fa3);
            color: #ffffff;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 123, 196, 0.25);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 123, 196, 0.4);
        }

        .back-link {
            color: #6d4c41; 
            background: none; 
            border: none;
            cursor: pointer; 
            text-decoration: underline; 
            font-size: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="form-container">
            <h2>로그인</h2>
            
            <div class="input-group">
                <label for="userId">아이디</label>
                <input type="text" id="userId" placeholder="아이디를 입력하세요">
            </div>

            <div class="input-group">
                <label for="userPw">비밀번호</label>
                <input type="password" id="userPw" placeholder="비밀번호를 입력하세요">
            </div>

            <button class="submit-btn" onclick="submitLogin()">로그인하기</button>
            
            <center><button class="back-link" onclick="location.href='menu.html'">이전으로</button></center>
        </div>
    </div>

    <script>
        // 처음 로드 시 아이디 입력창에 포커스
        document.getElementById('userId').focus();



        function submitLogin() {
            const id = document.getElementById('userId').value;
            const pw = document.getElementById('userPw').value;

            if(!id || !pw) {
                alert('아이디와 비밀번호를 모두 입력해 주세요!');
                return;
            }

            const loginData = {
                userId: id,
                userPw: pw
            };

            fetch('http://localhost:8000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            })
            .then(response => response.json())
            .then(data => {
                // 💡 [확인용 코드] 서버에서 어떤 데이터가 오는지 콘솔에 출력합니다.
                console.log("서버 응답 데이터:", data); 

                                if(data.status === "success") {
                    alert(data.message || "로그인 성공!");
                    
                    localStorage.setItem("user_name", data.user_name || "사용자");
                    // 💡 아래 한 줄을 추가하세요!
                    localStorage.setItem("user_id", document.getElementById('userId').value); 
                    
                    location.href = 'upload.html'; 
                } else {
                    // 메시지가 없을 경우를 대비해 기본 경고 문구를 줍니다.
                    alert(data.message || "로그인 실패! 아이디와 비밀번호를 확인하세요.");
                }
            })
            .catch(error => {
                // 네트워크 에러나 서버가 꺼져 있을 때 발생합니다.
                console.error('Error:', error);
                alert('서버 연결에 실패했습니다. server.py가 실행 중인지 확인하세요.');
            });
        }
    </script>
</body>
</html>
