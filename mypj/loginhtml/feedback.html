<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬치꼬치 AI - 피드백 리포트</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; min-height: 100%;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }

        .background-container {
            width: 100vw; min-height: 100vh;
            background-image: url("../interview.png");
            background-size: 100% 100%;
            background-position: center;
            background-attachment: fixed; /* 배경 고정 */
            display: flex; flex-direction: column;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: rgba(43, 120, 214, 0.9);
            padding: 12px 30px; color: white;
        }
        .btn-logout {
            background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 5px 12px; border-radius: 4px; cursor: pointer;
        }

        .report-wrapper {
            flex: 1; display: flex; justify-content: center; align-items: flex-start;
            padding: 50px 20px;
        }

        .report-container {
            width: 100%; max-width: 850px;
            background: rgba(255, 255, 255, 0.96); /* 💡 종이 느낌의 배경 */
            padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { color: #2b78d6; margin: 0; }
        .header p { color: #666; font-size: 14px; }

        .metric-group { display: flex; gap: 20px; margin-bottom: 30px; }
        .metric-card {
            flex: 1; background: white; border: 2px solid #e5d3b3;
            padding: 20px; border-radius: 10px; text-align: center;
        }
        .metric-label { font-size: 13px; font-weight: bold; color: #777; }
        .metric-value { font-size: 24px; font-weight: 800; color: #8b4513; margin-top: 5px; }

        .section { margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; overflow: hidden; }
        .section-title {
            background: #f8f9fa; padding: 15px 20px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: space-between; border-bottom: 1px solid #ddd;
        }
        .section-content { padding: 20px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; background: white; }
        .collapsed .section-content { display: none; }

        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-blue { background: #2b78d6; color: white; }
        .btn-gray { background: #e9ecef; color: #333; }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="navbar">
            <div class="logo" onclick="location.href='upload.html'">🤖 꼬치꼬치 AI 면접관</div>
            <button class="btn-logout" onclick="logout()">로그아웃</button>
        </div>

        <div class="report-wrapper">
            <div class="report-container" id="reportMain">
                <div class="header">
                    <h2>📊 AI 면접 채점 리포트</h2>
                    <p>지원자님의 면접 내용을 바탕으로 생성된 종합 분석 결과입니다.</p>
                </div>

                <div class="metric-group">
                    <div class="metric-card">
                        <div class="metric-label">💯 종합 점수</div>
                        <div class="metric-value" id="totalScore">0 / 100</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">🏅 예상 등급</div>
                        <div class="metric-value" id="grade">-</div>
                    </div>
                </div>

                <div class="section" id="sec1">
                    <div class="section-title" onclick="toggleSec('sec1')">✨ 핵심 강점 (Strengths)</div>
                    <div class="section-content" id="txtStrengths"></div>
                </div>
                <div class="section" id="sec2">
                    <div class="section-title" onclick="toggleSec('sec2')">⚠️ 보완할 점 (Weaknesses)</div>
                    <div class="section-content" id="txtWeaknesses"></div>
                </div>
                <div class="section" id="sec3">
                    <div class="section-title" onclick="toggleSec('sec3')">💡 코칭 가이드 (Coaching)</div>
                    <div class="section-content" id="txtCoaching"></div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-gray" onclick="location.href='interview.html'">🔄 다시 시도</button>
                    <button class="btn btn-blue" onclick="location.href='upload.html'">📄 홈으로 이동</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const data = JSON.parse(localStorage.getItem("feedback_report"));
            if (!data) { alert("리포트가 없습니다."); return; }

            document.getElementById("totalScore").textContent = `${data.total_score} / 100`;
            document.getElementById("grade").textContent = `${data.grade} 등급`;
            document.getElementById("txtStrengths").textContent = data.strengths;
            document.getElementById("txtWeaknesses").textContent = data.weaknesses;
            document.getElementById("txtCoaching").textContent = data.best_answer_guide;
        });

        function toggleSec(id) { document.getElementById(id).classList.toggle("collapsed"); }

        function logout() {
            if(confirm("로그아웃 하시겠습니까?")) {
                localStorage.clear();
                location.href = "login.html";
            }
        }
    </script>
</body>
</html>
