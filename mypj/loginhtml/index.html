<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬치꼬치 AI 면접 코칭 - 홈</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        .background-container {
            position: relative;
            width: 100vw; 
            height: 100vh;
            /* 💡 1. 요청하신 대로 이미지 파일명을 endimg.png로 변경했습니다. */
            background-image: url("../endimg.png"); 
            /* 💡 background-size를 100% 100%로 유지하여 화면 왜곡 없이 이미지 전체가 꽉 차게 만듭니다. */
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 💡 2. 화면 크기에 따라 버튼의 위치와 크기가 완벽하게 늘어났다 줄어들게 설정 */
        .start-button {
            position: absolute;
            /* 💡 bottom 값을 23% -> 27%로 올려서 버튼 위치를 위로 이동시켰습니다! */
            bottom: 26%; 
            left: 50%;
            transform: translateX(-50%); /* 가로축 기준 정중앙 정렬 */
            
            /* 화면 크기에 따라 버튼 크기도 자동 조절 */
            width: 22%;       
            height: 9.5vh;    
            
            /* 버튼을 투명하게 설정 */
            background-color: rgba(0, 0, 0, 0.0);
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            outline: none;
            
            transition: all 0.2s ease;
        }

        /* 마우스를 올렸을 때 버튼 영역이 살짝 반짝이도록 효과 부여 */
        .start-button:hover { 
            background-color: rgba(255, 255, 255, 0.15); 
        }
    </style>
</head>
<body>

    <div class="background-container">
        <button class="start-button" onclick="location.href='menu.html'"></button>
    </div>

</body>
</html>
