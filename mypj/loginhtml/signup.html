<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꼬치꼬치 AI 면접 코칭 - 회원가입</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; min-height: 100%;
            overflow-x: hidden;
            background-color: #f7f3ee; /* 이미지 로딩 전 자연스러운 미색 배경 */
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 💡 1. 배경을 interview.png 풀스크린으로 지정하고 정중앙 정렬 */
        .background-container {
            width: 100vw;
            min-height: 100vh;
            background-image: url("../interview.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            box-sizing: border-box;
        }

        /* 💡 2. 폼 컨테이너를 따뜻한 반투명 크림 화이트 톤으로 대폭 수정 */
        .form-container {
            width: 450px; 
            background: rgba(255, 255, 255, 0.92); /* 투명도가 들어간 크림화이트 */
            padding: 40px;
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(139, 90, 43, 0.2); /* 갈색 톤의 부드러운 그림자 */
            border: 1px solid rgba(230, 215, 200, 0.8);
            box-sizing: border-box;
        }

        /* 제목: 캐릭터 옷 및 꼬치 바베큐의 짙은 오렌지 브라운 톤 */
        .form-container h2 { 
            margin-top: 0; 
            color: #e05300; 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 1.8rem;
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #5d4037; font-weight: bold; }
        .input-row { display: flex; gap: 10px; }
        
        /* 💡 3. 입력창(input)과 선택창(select)을 밝은 아이보리 톤으로 변경 */
        input, select {
            width: 100%; 
            padding: 12px; 
            background: #ffffff; 
            border: 1px solid #d7ccc8;
            border-radius: 8px; 
            color: #3e2723; /* 짙은 브라운 글씨색 */
            font-size: 1rem; 
            box-sizing: border-box; 
            outline: none;
            transition: all 0.2s ease;
        }
        /* 포커스 되었을 때 로고의 푸른 색상으로 포인트 */
        input:focus, select:focus { 
            border-color: #007bc4; 
            box-shadow: 0 0 5px rgba(0, 123, 196, 0.2);
        }

        /* 💡 4. 중복확인 등 내부 인라인 버튼: 로고의 청량한 블루 컬러 매칭 */
        .inline-btn { 
            width: 120px; 
            background: #2eb0ec; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s ease;
        }
        .inline-btn:hover { background: #007bc4; }

        .email-row { display: flex; align-items: center; gap: 8px; color: #5d4037; }
        .msg { font-size: 0.85rem; margin-top: 5px; display: block; font-weight: bold; }
        .error-msg { color: #d32f2f; } /* 가독성을 위해 살짝 짙은 레드 */
        .success-msg { color: #2e7d32; } /* 가독성을 위해 살짝 짙은 그린 */

        /* 💡 5. 가입하기 대형 버튼: 캐릭터 꼬치의 오렌지-브라운 그라데이션 매칭 */
        .submit-btn {
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(90deg, #ff8c28, #e05300);
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(224, 83, 0, 0.25);
            transition: all 0.2s ease;
        }
        .submit-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(224, 83, 0, 0.4);
        }

        /* 하단 이전으로 링크: 테이블 나무 색상 계열 매칭 */
        .back-link { 
            margin-top: 20px; 
            color: #7d56c2; /* 눈에 띄도록 세련된 보라빛 브라운 혹은 짙은 갈색 */
            color: #6d4c41;
            background: none; 
            border: none; 
            cursor: pointer; 
            text-decoration: underline; 
            font-size: 0.9rem; 
            font-weight: bold;
        }
        .back-link:hover { color: #3e2723; }
    </style>
</head>
<body>

    <div class="background-container">
        <div class="form-container">
            <h2>회원가입</h2>

            <div class="input-group">
                <label>이름</label>
                <div class="input-row">
                    <input type="text" id="userName" placeholder="이름을 입력하세요">
                </div>
            </div>
            
            <div class="input-group">
                <label>아이디</label>
                <div class="input-row">
                    <input type="text" id="userId" placeholder="사용할 ID 입력">
                    <button class="inline-btn" onclick="checkIdDup()">중복확인</button>
                </div>
            </div>

            <div class="input-group">
                <label>비밀번호 (영문, 숫자, 특수문자 포함 10~15자)</label>
                <input type="password" id="userPw" oninput="validatePassword()" placeholder="비밀번호 입력">
                <span id="pwValidMsg" class="msg"></span>
            </div>

            <div class="input-group">
                <label>비밀번호 확인</label>
                <input type="password" id="userPwCheck" oninput="checkPasswordMatch()" placeholder="비밀번호 재입력">
                <span id="pwMatchMsg" class="msg"></span>
            </div>

            <div class="input-group">
                <label>전화번호</label>
                <input type="text" id="userPhone" oninput="formatPhoneNumber(this)" maxlength="13" placeholder="010-xxxx-xxxx">
            </div>

            <div class="input-group">
                <label>이메일 주소</label>
                <div class="email-row">
                    <input type="text" id="emailId" placeholder="이메일">
                    <span>@</span>
                    <input type="text" id="emailDomain" placeholder="직접 입력">
                    <select id="emailSelect" onchange="selectDomain(this)">
                        <option value="">직접입력</option>
                        <option value="naver.com">naver.com</option>
                        <option value="gmail.com">gmail.com</option>
                        <option value="daum.net">daum.net</option>
                    </select>
                </div>
            </div>

            <button class="submit-btn" onclick="submitSignUp()">가입하기</button>
            <center><button class="back-link" onclick="location.href='menu.html'">이전으로</button></center>
        </div>
    </div>

    <script>
    function submitSignUp() {
        // 💡 1. 추가된 이름 입력창에서 값을 가져옵니다.
        const name = document.getElementById('userName').value; 
        const id = document.getElementById('userId').value;
        const pw = document.getElementById('userPw').value;
        const phone = document.getElementById('userPhone').value;
        const emailId = document.getElementById('emailId').value;
        const emailDomain = document.getElementById('emailDomain').value;
        const email = `${emailId}@${emailDomain}`;

        // 💡 2. 입력값 검증에 userName도 포함하세요.
        if(!name || !id || !pw || !phone || !emailId || !emailDomain) {
            alert('모든 양식을 정확히 입력해 주세요!');
            return;
        }

        // 💡 3. 서버가 기대하는 signupData 객체에 userName을 넣어줍니다.
        const signupData = {
            userName: name, // 이 필드가 추가되어야 합니다!
            userId: id,
            userPw: pw,
            userPhone: phone,
            userEmail: email
        };

        fetch('http://localhost:8000/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(signupData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                alert('축하합니다! 회원정보가 MariaDB에 안전하게 저장되었습니다.');
                location.href = 'menu.html'; 
            } else {
                // 💡 만약 그래도 실패한다면 상세 내용을 보여줍니다.
                alert('가입 실패: ' + (data.message || "알 수 없는 오류"));
            }
        })
        .catch(error => {
            console.error(error); // 콘솔에서 에러 확인
            alert('서버 연결에 실패했습니다.');
        });
}

        // --- 유효성 검사 로직들 ---
        function checkIdDup() {
    const id = document.getElementById('userId').value;
    if (!id) {
        alert('아이디를 먼저 입력해주세요.');
        return;
    }

    // 서버에 중복 확인 요청
    fetch('http://localhost:8000/check-id', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: id })
    })
    .then(response => response.json())
    .then(data => {
        // 서버에서 받은 결과(status)에 따라 알림
        if (data.status === "success") {
            alert(data.message); // "사용 가능한 아이디입니다."
            // 필요하다면 아이디 중복확인 완료 상태를 변수에 저장해두는 것도 좋습니다.
        } else {
            alert(data.message); // "이미 사용 중인 아이디입니다."
            document.getElementById('userId').focus();
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('서버 연결에 실패했습니다.');
    });
}

        function validatePassword() {
            const pw = document.getElementById('userPw').value;
            const msg = document.getElementById('pwValidMsg');
            const pwRegex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>])[a-zA-Z\d!@#$%^&*(),.?":{}|<>]{10,15}$/;

            if (pw.length === 0) msg.textContent = "";
            else if (pwRegex.test(pw)) {
                msg.textContent = "✔ 안전한 비밀번호입니다.";
                msg.className = "msg success-msg";
            } else {
                msg.textContent = "✕ 영문/숫자/특수문자 포함 10~15자 내외여야 합니다.";
                msg.className = "msg error-msg";
            }
            checkPasswordMatch();
        }

        document.getElementById('userId').focus();

        function checkPasswordMatch() {
            const pw = document.getElementById('userPw').value;
            const pwCheck = document.getElementById('userPwCheck').value;
            const msg = document.getElementById('pwMatchMsg');

            if (pwCheck.length === 0) { msg.textContent = ""; return; }
            if (pw === pwCheck) {
                msg.textContent = "✔ 비밀번호가 같습니다.";
                msg.className = "msg success-msg";
            } else {
                msg.textContent = "✕ 비밀번호가 다릅니다.";
                msg.className = "msg error-msg";
            }
        }

        function formatPhoneNumber(input) {
            let num = input.value.replace(/[^0-9]/g, '');
            if (num.length < 4) input.value = num;
            else if (num.length < 8) input.value = num.substr(0, 3) + '-' + num.substr(3);
            else input.value = num.substr(0, 3) + '-' + num.substr(3, 4) + '-' + num.substr(7, 4);
        }

        function selectDomain(select) {
            const domainInput = document.getElementById('emailDomain');
            domainInput.value = select.value;
            if(select.value !== "") {
                domainInput.readOnly = true;
                domainInput.style.background = "#eeeeee"; /* 밝은 비활성화 테마 배경 */
            } else {
                domainInput.readOnly = false;
                domainInput.style.background = "#ffffff";
                domainInput.focus();
            }
        }
    </script>
</body>
</html>
